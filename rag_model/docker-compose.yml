services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ros2-rag-api
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ros2_rag
      RAW_COLLECTION: raw_documents
      CHUNK_COLLECTION: document_chunks
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ros2_knowledge_base
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      HF_MODEL_NAME: google/flan-t5-base
      TOP_K: 5
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - qdrant

  gradio:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ros2-rag-gradio
    command: ["python", "gradio_ui.py"]
    ports:
      - "7860:7860"
    depends_on:
      - api

  mongo:
    image: mongo:7
    container_name: ros2-rag-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ros2-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data: